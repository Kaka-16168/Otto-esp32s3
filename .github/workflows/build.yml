name: Build Boards

on:
  workflow_dispatch: 
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build_otto:
    name: Build otto-robot
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v6.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch config.json
        shell: bash
        run: |
          cd xiaozhi-esp32
          # 使用 jq 工具修改 json，清理旧配置并写入卡卡
          jq '(.builds[] | select(.name=="otto-robot").sdkconfig_append) |= map(select((contains("WAKE_WORD") or contains("LANGUAGE") or contains("WN9")) | not)) + ["CONFIG_LANGUAGE_ZH_CN=y", "CONFIG_USE_ESP_WAKE_WORD=n", "CONFIG_USE_AFE_WAKE_WORD=n", "CONFIG_USE_CUSTOM_WAKE_WORD=y", "CONFIG_CUSTOM_WAKE_WORD=\"ka ka\"", "CONFIG_CUSTOM_WAKE_WORD_DISPLAY=\"卡卡\""]' main/boards/otto-robot/config.json > config_tmp.json
          mv config_tmp.json main/boards/otto-robot/config.json
          echo "Patch 成功，当前配置："
          grep -A 10 "otto-robot" main/boards/otto-robot/config.json

      - name: Build
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          cd xiaozhi-esp32
          rm -f sdkconfig sdkconfig.old
          rm -rf build
          python scripts/build.py otto-robot --name otto-robot

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi_otto-robot_full
          path: xiaozhi-esp32/build/merged-binary.bin
          if-no-files-found: error
