name: Build Boards

on:
  workflow_dispatch: 
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build_otto:
    name: Build otto-robot
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v6.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch config.json for custom wake word
        shell: bash
        run: |
          cd xiaozhi-esp32
          # 使用 Python 脚本动态修改 otto-robot 的配置文件
          python -c "
import json
import os

file_path = 'main/boards/otto-robot/config.json'
if os.path.exists(file_path):
    with open(file_path, 'r', encoding='utf-8') as f:
        config = json.load(f)
    
    for build in config.get('builds', []):
        if build.get('name') == 'otto-robot':
            # 剔除原本冲突的唤醒词和语言配置
            new_sdkconfig = []
            for item in build.get('sdkconfig_append', []):
                if 'WAKE_WORD' not in item and 'LANGUAGE' not in item and 'WN9' not in item:
                    new_sdkconfig.append(item)
            
            # 追加我们想要的中文+卡卡配置
            new_sdkconfig.append('CONFIG_LANGUAGE_ZH_CN=y')
            new_sdkconfig.append('CONFIG_USE_ESP_WAKE_WORD=n')
            new_sdkconfig.append('CONFIG_USE_AFE_WAKE_WORD=n')
            new_sdkconfig.append('CONFIG_USE_CUSTOM_WAKE_WORD=y')
            new_sdkconfig.append('CONFIG_CUSTOM_WAKE_WORD=\"ka ka\"')
            new_sdkconfig.append('CONFIG_CUSTOM_WAKE_WORD_DISPLAY=\"卡卡\"')
            
            build['sdkconfig_append'] = new_sdkconfig
    
    with open(file_path, 'w', encoding='utf-8') as f:
        json.dump(config, f, indent=2, ensure_ascii=False)
    print('config.json patched successfully!')
else:
    print('config.json not found!')
"

      - name: Build otto-robot variant (with custom wake word "ka ka")
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          cd xiaozhi-esp32
          
          # 清理旧的构建配置和产物
          rm -f sdkconfig sdkconfig.old
          rm -rf build
          
          # 执行构建
          python scripts/build.py otto-robot --name otto-robot

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi_otto-robot_full
          path: xiaozhi-esp32/build/merged-binary.bin
          if-no-files-found: error
