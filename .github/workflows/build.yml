name: Build Boards

on:
  workflow_dispatch: 
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build_otto:
    name: Build otto-robot
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v6.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch config.json
        shell: bash
        run: |
          cd xiaozhi-esp32
          
          echo "开始修改 config.json..."
          
          # 使用 Python 单行执行模式，避免多行字符串引发的 YAML 缩进错误
          python3 -c "
import json, os
file_path = 'main/boards/otto-robot/config.json'
if os.path.exists(file_path):
    with open(file_path, 'r', encoding='utf-8') as f:
        config = json.load(f)
    for build in config.get('builds', []):
        if build.get('name') == 'otto-robot':
            new_cfg = []
            for item in build.get('sdkconfig_append', []):
                if 'WAKE_WORD' not in item and 'LANGUAGE' not in item and 'WN9' not in item:
                    new_cfg.append(item)
            new_cfg.extend([
                'CONFIG_LANGUAGE_ZH_CN=y',
                'CONFIG_USE_ESP_WAKE_WORD=n',
                'CONFIG_USE_AFE_WAKE_WORD=n',
                'CONFIG_USE_CUSTOM_WAKE_WORD=y',
                'CONFIG_CUSTOM_WAKE_WORD=\"ka ka\"',
                'CONFIG_CUSTOM_WAKE_WORD_DISPLAY=\"卡卡\"'
            ])
            build['sdkconfig_append'] = new_cfg
    with open(file_path, 'w', encoding='utf-8') as f:
        json.dump(config, f, indent=2, ensure_ascii=False)
    print('Patch 成功!')
else:
    print('找不到 config.json!')
"

      - name: Build otto-robot
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          cd xiaozhi-esp32
          rm -f sdkconfig sdkconfig.old
          rm -rf build
          python scripts/build.py otto-robot --name otto-robot

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi_otto-robot_full
          path: xiaozhi-esp32/build/merged-binary.bin
          if-no-files-found: error
